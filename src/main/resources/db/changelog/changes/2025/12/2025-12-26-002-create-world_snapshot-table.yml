databaseChangeLog:
  - changeSet:
      id: 2025-12-26-002-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: world_snapshot
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tick
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: saved_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: global_state
                  type: JSONB
                  constraints:
                    nullable: false
