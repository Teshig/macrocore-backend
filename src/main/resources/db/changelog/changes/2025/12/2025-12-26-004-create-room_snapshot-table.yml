databaseChangeLog:
  - changeSet:
      id: 2025-12-26-004-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: room_snapshot
            columns:
              - column:
                  name: snapshot_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: zone_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: JSONB
                  constraints:
                    nullable: false

  - changeSet:
      id: 2025-12-26-004-2
      author: grimjo
      changes:
        - addPrimaryKey:
            schemaName: game
            tableName: room_snapshot
            columnNames: snapshot_id, room_id
            constraintName: pk_room_snapshot

  - changeSet:
      id: 2025-12-26-004-3
      author: grimjo
      changes:
        - createIndex:
            schemaName: game
            tableName: room_snapshot
            indexName: idx_rooms_zone
            columns:
              - column: { name: snapshot_id }
              - column: { name: zone_id }

  - changeSet:
      id: 2025-12-26-004-4
      author: grimjo
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_rooms_state_gin ON game.room_snapshot USING gin (state);