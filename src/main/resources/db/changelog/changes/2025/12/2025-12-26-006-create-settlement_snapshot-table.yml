databaseChangeLog:
  - changeSet:
      id: 2025-12-26-006-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: settlement_snapshot
            columns:
              - column:
                  name: snapshot_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: zone_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: settlement_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: JSONB
                  constraints:
                    nullable: false

  - changeSet:
      id: 2025-12-26-006-2
      author: grimjo
      changes:
        - addPrimaryKey:
            schemaName: game
            tableName: settlement_snapshot
            columnNames: snapshot_id, zone_id, settlement_id
            constraintName: pk_settlement_snapshot

  - changeSet:
      id: 2025-12-26-006-3
      author: grimjo
      changes:
        - createIndex:
            schemaName: game
            tableName: settlement_snapshot
            indexName: idx_settlements_zone
            columns:
              - column: { name: snapshot_id }
              - column: { name: zone_id }

  - changeSet:
      id: 2025-12-26-005-5
      author: grimjo
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_settlements_state_gin ON game.settlement_snapshot USING gin (state);