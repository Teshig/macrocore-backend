databaseChangeLog:
  - changeSet:
      id: 2025-12-26-007-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: order_snapshot
            columns:
              - column:
                  name: snapshot_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: zone_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: settlement_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: JSONB
                  constraints:
                    nullable: false

  - changeSet:
      id: 2025-12-26-007-2
      author: grimjo
      changes:
        - addPrimaryKey:
            schemaName: game
            tableName: order_snapshot
            columnNames: snapshot_id, zone_id, settlement_id, order_id
            constraintName: pk_order_snapshot

  - changeSet:
      id: 2025-12-26-007-3
      author: grimjo
      changes:
        - createIndex:
            schemaName: game
            tableName: order_snapshot
            indexName: idx_orders_zone
            columns:
              - column: { name: snapshot_id }
              - column: { name: zone_id }

  - changeSet:
      id: 2025-12-26-007-4
      author: grimjo
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_orders_state_gin ON game.order_snapshot USING gin (state);