databaseChangeLog:
  - changeSet:
      id: 2025-12-26-008-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: content_version
            columns:
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: content_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueDate: CURRENT_TIMESTAMP