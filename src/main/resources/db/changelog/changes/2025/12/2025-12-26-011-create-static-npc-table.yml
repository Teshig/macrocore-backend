databaseChangeLog:
  - changeSet:
      id: 2025-12-26-011-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: npc
            columns:
              - column:
                  name: zone_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: npc_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: base_stats
                  type: JSONB
                  defaultValue: '{}'

  - changeSet:
      id: 2025-12-26-011-2
      author: grimjo
      changes:
        - addPrimaryKey:
            schemaName: game
            tableName: npc
            columnNames: zone_id, npc_id
            constraintName: pk_npc_static