databaseChangeLog:
  - changeSet:
      id: 2025-12-26-012-1
      author: grimjo
      changes:
        - createTable:
            schemaName: game
            tableName: settlement
            columns:
              - column:
                  name: zone_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: settlement_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT

  - changeSet:
      id: 2025-12-26-012-2
      author: grimjo
      changes:
        - addPrimaryKey:
            schemaName: game
            tableName: settlement
            columnNames: zone_id, settlement_id
            constraintName: pk_settlement_static