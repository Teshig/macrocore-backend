databaseChangeLog:
  - changeSet:
      id: 2026-08-23-013-1
      author: junie
      changes:
        - createTable:
            schemaName: game
            tableName: player
            columns:
              - column:
                  name: player_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: zone_id
                  type: BIGINT
              - column:
                  name: room_id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT